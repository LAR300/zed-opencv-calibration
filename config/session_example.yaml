# Session file for zed_stereo_calibration --session (traceable capture mode).
# Spec: .ai/specs/persistencia-captura/spec.md
#
# Every field is mandatory. Write 'null' for what is unknown or does not apply (for example the port in
# air without the acrylic); never leave a field out. Texts that start with a digit, such as dates and the
# lens, must be quoted: cv::FileStorage would try to read them as numbers.
#
# The capture is written to <output_root>/<condition>/captura_<XX>/. The tool refuses to start if that
# folder already exists and is not empty: nothing is ever overwritten or deleted.

output_root: /workspaces/isaac_ros-dev/dev/calib_runs/dados
condition: A_ar_sem_acrilico     # letters, digits, '_' and '-'
capture: 1                       # 1..99 -> captura_01..captura_99
lens: "2.1mm"
note: ""

target_measured:                 # caliper, before the session (brief R7)
  tag_size_mm: 88.0
  tag_spacing_mm: 26.4
  planarity_mm: null             # largest deviation from a plane, mm
  measured_on: "2026-11-03"
  # metric test session only (spec validacao-metrica R4); optional elsewhere
  tag_sides_mm: null             # list: at least 6 tags, edges and centre
  spacings_mm: null              # list: at least 6 pairs of neighbouring tags
  board_side_mm: null            # whole grid, outer edge to outer edge
  planarity_grid_mm: null        # list: 9 signed deviations, 3x3 grid, row-major

port:                            # flat port in front of the camera (brief R8); null in air
  present: false
  material: null                 # e.g. PMMA
  thickness_mm: null
  lens_to_port_mm: null
  tilt_deg: null
  refractive_index: null         # >= 1

medium:
  type: air                      # air | fresh_water | sea_water
  water_temperature_c: null
  salinity_psu: null
  refractive_index: null         # >= 1

calibration:                     # optional; these are the defaults (spec saida-calibracao)
  model: rational8               # rational8 | fisheye4
  max_rms_px: 0.5                # acceptance: per-corner RMS of each camera and of the stereo fit
  outlier_factor: 2.5            # a view is removed above max(factor * median, floor)
  outlier_floor_px: 0.5
  prior: none                    # none: from scratch | factory: start from the factory calibration

static_capture:                  # optional (spec captura-estatica); PROVISIONAL defaults
  window_s: 1.0                  # the target must be still this long before a pair is saved
  max_displacement_px: 0.5       # RMS corner motion between frames counted as "still";
                                 # set from noise.json (--measure_static_noise) on the bench
  min_target_sharpness: 0        # Laplacian variance on the tags; 0 = not checked until measured

# Script mode (roteiro-poses R5, R7); null or absent = free capture. Relative paths are
# taken from this file's folder.
roteiro: null                    # e.g. roteiro_v1.yaml
pose_calibration: null           # PnP guidance only; null = <output_root>/fabrica/SN<serial>/calib_factory_rational8.yml
